services:
  - type: web
    name: zaib-ambrendry
    env: php
    plan: free
    buildCommand: composer install --no-dev && npm install && npm run build
    startCommand: vendor/bin/heroku-php-apache2 public/
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
    postDeploy: php artisan migrate --force
